<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Velvet Nail Studio POS</title>
<style>
:root{--accent:#c85d78;--accent-soft:#f7e7ec;--ink:#2d2427;--muted:#82767a;--line:#e9dfe2;--bg:#f7f4f5;--card:#fff;--danger:#b63f49;--ok:#2d8a62;--font-weight:400}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#faedf1,#fff)}
.login-card{width:420px;max-width:92%;background:#fff;padding:34px;border-radius:24px;box-shadow:0 24px 70px #0002}
.logo{width:72px;height:46px;border-radius:0;background:transparent;color:transparent;display:grid;place-items:center;font-weight:900;overflow:visible}
.logo img{width:100%;height:100%;object-fit:contain;display:block}.login-card h1{margin:16px 0 4px}.muted{color:var(--muted);font-size:12px}
.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn,.primary,.danger,.success{border:0;border-radius:9px;padding:10px 12px;font-weight:800}.btn{background:#f2eaed;color:var(--ink)}.primary{background:var(--accent);color:#fff}.danger{background:#fdecef;color:var(--danger)}.success{background:#e9f6ef;color:var(--ok)}
#app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:240px;background:#fff;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;z-index:10}
.brand{display:flex;align-items:center;gap:10px;padding:2px 7px 20px}.brand .logo{width:78px;height:42px;border-radius:0;background:transparent}.brand b{display:block}.brand small{color:var(--muted)}
.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;text-align:left;padding:11px;border-radius:10px;font-weight:800;color:#65595e}.nav button:hover,.nav button.active{background:var(--accent-soft);color:var(--accent)}
.sidebar-bottom{margin-top:auto;display:grid;gap:6px}.main{margin-left:240px}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 24px;position:sticky;top:0;z-index:5}.topbar h2{margin:0}.content{padding:24px;max-width:1500px;margin:auto}
.grid{display:grid;gap:15px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px}.stat-label{font-size:12px;color:var(--muted)}.stat{font-size:26px;font-weight:900;margin-top:6px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.toolbar h3{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.search{max-width:320px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px;font-size:12px}.table th,.table td{padding:11px 9px;border-bottom:1px solid #f0e8ea;text-align:left}.table th{font-size:10px;color:var(--muted);text-transform:uppercase}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#f1eaec;font-size:10px;font-weight:800}.badge.ok{background:#e8f5ee;color:var(--ok)}.badge.bad{background:#fdecef;color:var(--danger)}
.pos-layout{display:grid;grid-template-columns:minmax(0,1.4fr) 390px;gap:15px}.service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.service{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px;text-align:left}.service:hover{border-color:var(--accent)}.service b{display:block}.service small{display:block;color:var(--muted);margin:5px 0}.price{font-weight:900;color:var(--accent)}
.cart-item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #eee}.qty{display:flex;gap:5px;align-items:center}.qty button{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:7px}.total-row{display:flex;justify-content:space-between;padding:6px 0}.grand{font-size:20px;font-weight:900;border-top:1px solid var(--line);margin-top:7px;padding-top:12px}
.modal-bg{position:fixed;inset:0;background:#0006;display:grid;place-items:center;padding:20px;z-index:50}.modal{width:620px;max-width:96%;max-height:88vh;overflow:auto;background:#fff;border-radius:16px;padding:20px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.empty{text-align:center;color:var(--muted);padding:28px}
.logo-preview{height:110px;border:1px dashed #d8cdd0;border-radius:12px;display:grid;place-items:center;background:#fbf8f9;overflow:hidden}.logo-preview img{max-width:90%;max-height:95px}
.theme{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #ccc}.theme.active{box-shadow:0 0 0 2px #222}

.category-columns{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.category-panel{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fcfafb;min-height:210px}
.category-panel h3{margin:0 0 12px;font-size:16px}
.category-panel .service-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.other-panel{margin-top:16px;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.other-panel .service-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.custom-panel{margin-top:16px;border:1px solid var(--line);border-radius:14px;padding:16px;background:#fbf8f9}
.custom-row{display:grid;grid-template-columns:1.6fr .8fr auto;gap:10px;align-items:end}
.dashboard-stat{cursor:pointer;transition:.15s}
.dashboard-stat:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 8px 22px #0000000d}
@media(max-width:900px){.category-columns{grid-template-columns:1fr}.category-panel .service-grid,.other-panel .service-grid{grid-template-columns:repeat(2,1fr)}.custom-row{grid-template-columns:1fr}}

@media(max-width:1000px){.sidebar{width:200px}.main{margin-left:200px}.g4{grid-template-columns:1fr 1fr}.pos-layout{grid-template-columns:1fr}.service-grid{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.sidebar{position:static;width:100%;height:auto}.nav{grid-template-columns:repeat(5,1fr);overflow:auto}.main{margin-left:0}.content{padding:15px}.g4,.g3,.g2{grid-template-columns:1fr}.service-grid{grid-template-columns:1fr}.topbar{padding:0 14px}}

/* 字体设置：只控制字体颜色与粗细 */
body,button,input,select,textarea,.nav button,.field label,.btn,.primary,.danger,.success,.stat,.table th,.badge,.price{font-weight:var(--font-weight)!important}
</style>

  width:64px!important;height:64px!important;border-radius:50%!important;

}
</style>

.dashboard-sales-head{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%}.customer-actions,.service-actions{display:flex;align-items:center;justify-content:space-between;gap:10px}
.customer-actions .search,.service-actions .search{flex:1;min-width:220px}

<style id="settings-two-column-eye-style">
.settings-two-col{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:18px;
  align-items:start;
}
.settings-left,.settings-right{
  display:grid;
  gap:14px;
}
.password-wrap{
  position:relative;
}
.password-wrap input{
  padding-right:46px!important;
}
.password-eye{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:transparent;
  display:grid;
  place-items:center;
  cursor:pointer;
  font-size:16px;
  color:var(--font-color,#000);
}
.password-eye:hover{
  background:color-mix(in srgb,var(--accent) 10%,transparent);
}
@media(max-width:850px){
  .settings-two-col{grid-template-columns:1fr}
}
</style>

<style id="figure-2-template-lock">
/* 图2 desktop template */
html,body{width:100%;max-width:100%;overflow-x:hidden}
#app{width:100%;max-width:100%}
.sidebar{width:236px}
.main{margin-left:236px;width:calc(100% - 236px);min-width:0}
.content{width:100%;max-width:1500px;min-width:0}
.pos-layout{grid-template-columns:minmax(0,1fr) 390px;min-width:0}
.pos-layout>*{min-width:0}
.card,.category-panel,.other-panel,.custom-panel{min-width:0}
.lang-switch-safe{display:inline-flex!important;visibility:visible!important}
.menu-toggle-settings{width:100%;margin:0;padding-top:12px;border-top:1px solid var(--line)}
.menu-toggle-heading{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:9px}
.menu-toggle-heading h3{margin:0;font-size:15px}
.menu-toggle-heading .muted{font-size:11px;text-align:right}
.menu-toggle-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 10px}
.menu-toggle-item{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:12px}
.menu-switch{position:relative;width:54px;height:26px;flex:0 0 54px;padding:0;border:0;border-radius:999px;background:#c9cbd1;color:#fff;cursor:pointer;transition:background .16s ease;box-shadow:none}
.menu-switch::before{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .16s ease;box-shadow:0 1px 3px #0003}
.menu-switch[aria-pressed="true"]{background:var(--accent)}
.menu-switch[aria-pressed="true"]::before{transform:translateX(28px)}
.menu-switch .switch-text{position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:9px;font-weight:700;line-height:1}
.menu-switch[aria-pressed="true"] .switch-text{right:auto;left:7px}

/* Smaller laptop / iPad landscape: keep the same design, stack the order panel safely */
@media (min-width:1001px) and (max-width:1250px){
  .sidebar{width:200px}
  .main{margin-left:200px;width:calc(100% - 200px)}
  .content{padding:16px}
  .pos-layout{grid-template-columns:minmax(0,1fr)}
  .service-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media (max-width:1000px){
  .main{width:calc(100% - 200px)}
}

@media (max-width:720px){
  .sidebar{width:100%}
  .main{width:100%;margin-left:0}
  .topbar{height:auto;min-height:64px;gap:8px;flex-wrap:wrap}
  .lang-switch-safe{margin-left:auto}
  .nav button{white-space:nowrap}
  .content{width:100%;max-width:100%}
  .menu-toggle-settings{width:100%}
  .menu-toggle-heading{align-items:flex-start;flex-direction:column}
  .menu-toggle-heading .muted{text-align:left}
  .menu-toggle-list{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* Final responsive safety layer: laptop, iPad and phone */
html{-webkit-text-size-adjust:100%}
img,svg{max-width:100%}
.card,.field,.toolbar,.actions,.table-wrap,.settings-two-col,.settings-left,.settings-right{min-width:0}
.table-wrap{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.modal{width:min(620px,calc(100vw - 28px))}

@media (max-width:1000px){
  .toolbar{flex-wrap:wrap;align-items:flex-start!important}
  .toolbar>.actions{max-width:100%}
  .search{max-width:100%}
}

@media (max-width:720px){
  .sidebar{position:static;inset:auto;height:auto;min-height:0;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{min-height:58px!important;padding:2px 4px 8px!important}
  .brand .logo{width:48px!important;height:48px!important;min-width:48px!important}
  .nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;overflow:visible}
  .nav button{min-width:0;padding:9px 7px;text-align:center;white-space:normal;overflow-wrap:anywhere;font-size:12px;line-height:1.25}
  .sidebar-bottom{grid-template-columns:1fr;margin-top:8px}
  .sidebar-bottom button{width:100%}
  .topbar{position:sticky;top:0;padding:9px 12px;min-width:0}
  .topbar h2{font-size:20px;min-width:0;overflow-wrap:anywhere}
  .content{padding:12px}
  .card{padding:13px;border-radius:12px}
  .toolbar{gap:8px}
  .toolbar>.actions{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto}
  .toolbar>.actions .search{width:100%;min-width:0}
  .pos-layout{gap:12px}
  .category-panel,.other-panel,.custom-panel{padding:11px}
  .category-panel .service-grid,.other-panel .service-grid{grid-template-columns:1fr}
  .service{padding:12px}
  input,select,textarea{font-size:16px}
  .modal-bg{padding:10px;align-items:center}
  .modal{max-width:none;max-height:calc(100dvh - 20px);padding:15px;border-radius:13px}
  .modal .g2,.modal .g3,.modal .g4{grid-template-columns:1fr}
  .modal-actions{position:sticky;bottom:-15px;background:#fff;padding:10px 0 0;flex-wrap:wrap}
}

@media (max-width:480px){
  .nav{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lang-switch-safe button{padding:6px 8px;font-size:11px}
  .toolbar>.actions{grid-template-columns:1fr}
  .toolbar>.actions>*{width:100%;max-width:100%}
  .actions .btn,.actions .primary,.actions .danger,.actions .success{flex:1 1 auto}
  .menu-toggle-list{grid-template-columns:1fr}
  .custom-row{grid-template-columns:1fr}
  .stat{font-size:22px}
}

/* Desktop / iPad workspace scrolling: keep the page fixed and scroll only data areas */
@media (min-width:721px){
  html,body{height:100%;overflow:hidden}
  #app:not(.hidden){height:100dvh;overflow:hidden}
  .sidebar{height:100dvh;overflow:hidden}
  .sidebar .nav{min-height:0;overflow-y:auto;overscroll-behavior:contain}
  .main{height:100dvh;overflow:hidden}
  .content{height:calc(100dvh - 72px);max-height:calc(100dvh - 72px);overflow-y:auto;overscroll-behavior:contain}

  body[data-pos-page="pos"] .content,
  body[data-pos-page="appointments"] .content,
  body[data-pos-page="customers"] .content,
  body[data-pos-page="services"] .content,
  body[data-pos-page="reports"] .content,
  body[data-pos-page="settings"] .content{overflow:hidden}

  body[data-pos-page="pos"] .pos-layout{height:100%;min-height:0}
  body[data-pos-page="pos"] .pos-layout>.card{height:100%;min-height:0;overflow-y:auto;overscroll-behavior:contain}
  body[data-pos-page="pos"] #cartItems{max-height:30vh;overflow-y:auto;overscroll-behavior:contain}

  body[data-pos-page="appointments"] #content>.card,
  body[data-pos-page="customers"] #content>.card,
  body[data-pos-page="services"] #content>.card{height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  body[data-pos-page="appointments"] #content>.card>.table-wrap,
  body[data-pos-page="customers"] #content>.card>.table-wrap,
  body[data-pos-page="services"] #content>.card>.table-wrap{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}

  body[data-pos-page="reports"] #content{display:flex;flex-direction:column;min-height:0}
  body[data-pos-page="reports"] #content>.grid{flex:0 0 auto}
  body[data-pos-page="reports"] #content>.card{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  body[data-pos-page="reports"] #salesReportTable{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}

  body[data-pos-page="settings"] #content>.card{height:100%;min-height:0;overflow:hidden}
  body[data-pos-page="settings"] .settings-two-col{height:calc(100% - 34px);min-height:0;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}
  body[data-pos-page="settings"] .settings-left,
  body[data-pos-page="settings"] .settings-right{align-content:start;gap:9px;min-height:0}
  body[data-pos-page="settings"] .field{margin:7px 0}
  body[data-pos-page="settings"] .logo-preview{height:82px}
}

@media (min-width:721px) and (max-width:1000px){
  body[data-pos-page="pos"] .pos-layout{grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
}

/* Settings autofit: use the available screen height without browser zoom */
@media (min-width:721px){
  body[data-pos-page="settings"] .content{padding:clamp(8px,1.7vh,18px)}
  body[data-pos-page="settings"] #content{height:100%;min-height:0}
  body[data-pos-page="settings"] #content>.card{padding:clamp(9px,1.5vh,15px)}
  body[data-pos-page="settings"] #content>.card>h3{margin:0 0 clamp(5px,1vh,10px)}
  body[data-pos-page="settings"] .settings-two-col{height:calc(100% - 27px);gap:clamp(8px,1.4vw,18px)}
  body[data-pos-page="settings"] .settings-left,
  body[data-pos-page="settings"] .settings-right{gap:clamp(3px,.8vh,8px)}
  body[data-pos-page="settings"] .field{margin:clamp(2px,.55vh,6px) 0}
  body[data-pos-page="settings"] .field label{margin-bottom:clamp(2px,.45vh,5px)}
  body[data-pos-page="settings"] input,
  body[data-pos-page="settings"] select,
  body[data-pos-page="settings"] button{min-height:34px;padding-top:clamp(6px,.8vh,10px);padding-bottom:clamp(6px,.8vh,10px)}

function databasePayload(){const customers=JSON.parse(JSON.stringify(db.customers||[]));const sales=(db.sales||[]).map(sale=>({...JSON.parse(JSON.stringify(sale)),staffName:sale.staffName||db.staff.find(staff=>staff.id===sale.staffId)?.name||""}));const settings=JSON.parse(JSON.stringify(db.settings||{}));delete settings.googleAppsScriptUrl;delete settings.databaseKey;return {customers,sales,services:JSON.parse(JSON.stringify(db.services||[])),staff:JSON.parse(JSON.stringify(db.staff||[])),appointments:JSON.parse(JSON.stringify(db.appointments||[])),memberships:JSON.parse(JSON.stringify(db.memberships||[])),settings}}
async function databaseRequest(action,payload,urlOverride,keyOverride){const url=String(urlOverride||getDatabaseUrl()).trim(),apiKey=String(keyOverride||getDatabaseKey()).trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(url))throw new Error("Web App URL 不正确");const response=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,apiKey,payload:payload||null})});if(!response.ok)throw new Error("HTTP "+response.status);const result=await response.json();if(!result.ok)throw new Error(result.error||"Database error");return result}
async function syncToDatabase(){if(remoteSyncInProgress)return;remoteSyncInProgress=true;clearTimeout(remoteSaveTimer);try{await databaseRequest("save",databasePayload())}catch(error){console.warn("Google Sheet save failed:",error)}finally{remoteSyncInProgress=false;if(remoteSaveQueued){remoteSaveQueued=false;scheduleRemoteSave()}}}
async function syncFromDatabase(showMessage=false){if(remoteSyncInProgress)return;remoteSyncInProgress=true;try{const result=await databaseRequest("load");if(result.data&&typeof result.data==="object"){if(Array.isArray(result.data.customers))db.customers=result.data.customers;if(Array.isArray(result.data.sales))db.sales=result.data.sales;["services","staff","appointments","memberships"].forEach(key=>{if(Array.isArray(result.data[key]))db[key]=result.data[key];else remoteSaveQueued=true});const remoteSettings=result.data.settings&&typeof result.data.settings==="object"?result.data.settings:{};if(Object.keys(remoteSettings).length){const localUrl=getDatabaseUrl(),localKey=getDatabaseKey();db.settings={...db.settings,...remoteSettings,googleAppsScriptUrl:localUrl,databaseKey:localKey};db.settings.menuVisibility={...MENU_DEFAULTS,...(db.settings.menuVisibility||{})}}else remoteSaveQueued=true;localStorage.setItem(KEY,JSON.stringify(db));render();if(showMessage)toast("Google Sheet 资料和设置已载入")}else{remoteSyncInProgress=false;await syncToDatabase();remoteSyncInProgress=true;if(showMessage)toast("Google Sheet 已连接并建立资料")}}catch(error){console.warn("Google Sheet load failed:",error);if(showMessage)toast("连接失败："+error.message)}finally{remoteSyncInProgress=false;if(remoteSaveQueued){remoteSaveQueued=false;scheduleRemoteSave()}}}
function $(q){return document.querySelector(q)} function $$(q){return [...document.querySelectorAll(q)]}
function money(n){return "RM "+Number(n||0).toFixed(2)}
function uid(p){return p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function today(){return new Date().toISOString().slice(0,10)}
function dateOnly(value){const text=String(value||"").trim();if(!text)return "";const match=text.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);if(match)return `${match[1]}-${match[2]}-${match[3]}`;const date=new Date(text);if(Number.isNaN(date.getTime()))return text;const parts=Object.fromEntries(new Intl.DateTimeFormat("en",{timeZone:"Asia/Kuala_Lumpur",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(date).filter(part=>part.type!=="literal").map(part=>[part.type,part.value]));return `${parts.year}-${parts.month}-${parts.day}`}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.remove("hidden");clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.add("hidden"),1800)}
async function login(){
  if(getDatabaseUrl()&&getDatabaseKey())await syncFromDatabase(false);
  const username=$("#loginUser").value.trim();
  const password=$("#loginPass").value;
  if(username===(db.settings.username||"admin") && password===(db.settings.password||"admin123")){

    $("#app").classList.remove("hidden");
    $("#loginError").textContent="";

  }else{

}

function bindPage(){

  if($("#serviceSearch"))$("#serviceSearch").oninput=e=>{searchState.services=e.target.value;$("#serviceRows").innerHTML=serviceRows(db.services.filter(x=>(x.name+" "+x.category).toLowerCase().includes(searchState.services.toLowerCase())))};
  if($("#discMode")){$("#discMode").value=discMode;$("#discMode").onchange=e=>{discMode=e.target.value;refreshTotals()}};
  if($("#discAmount"))$("#discAmount").oninput=e=>{discAmount=e.target.value;refreshTotals()};
  if($("#addCustomServiceBtn"))$("#addCustomServiceBtn").onclick=addCustomService;
  if($("#clearCartBtn"))$("#clearCartBtn").onclick=()=>{db.cart=[];discAmount=0;save();refreshCart()};

  if($("#addStaffBtn"))$("#addStaffBtn").onclick=()=>editStaff();

  if($("#addMembershipBtn"))$("#addMembershipBtn").onclick=()=>editMembership();

function cartHtml(){return db.cart.length?db.cart.map(x=>`<div class="cart-item"><span><b>${esc(x.name)}</b><br><small>${money(x.price)} × ${x.qty}</small></span><div><b>${money(x.price*x.qty)}</b><div class="qty"><button onclick="changeQty('${x.id}',-1)">−</button><span>${x.qty}</span><button onclick="changeQty('${x.id}',1)">+</button></div></div></div>`).join(""):`<div class="empty">还没有加服务</div>`}
function cartSubtotal(){return db.cart.reduce((a,x)=>a+(Number(x.price)||0)*(Number(x.qty)||1),0)}
function discountValue(){const sub=cartSubtotal(),v=Math.max(0,Number(discAmount)||0);if(discMode==="deposit")return 0;return discMode==="fixed"?Math.min(v,sub):Math.min(sub,sub*v/100)}
function depositValue(){const sub=cartSubtotal();return discMode==="deposit"?Math.min(Math.max(0,Number(discAmount)||0),sub):0}
function totalsHtml(){const sub=cartSubtotal(),d=discountValue(),deposit=depositValue();return `<div class="total-row"><span>小计</span><b>${money(sub)}</b></div><div class="total-row"><span>${discMode==="deposit"?"Deposit":"折扣"}</span><b>- ${money(d+deposit)}</b></div><div class="total-row grand"><span>总额</span><b>${money(sub-d-deposit)}</b></div>`}
function refreshCart(){if($("#cartItems"))$("#cartItems").innerHTML=cartHtml();refreshTotals()}
function refreshTotals(){if($("#totals"))$("#totals").innerHTML=totalsHtml()}
function addToCart(id){const svc=db.services.find(s=>s.id===id);if(!svc)return;let x=db.cart.find(i=>i.id===id);if(x)x.qty++;else db.cart.push({id:svc.id,name:svc.name,price:svc.price,qty:1});save();refreshCart();toast("已加进订单")}
function changeQty(id,n){let x=db.cart.find(i=>i.id===id);if(!x)return;x.qty+=n;if(x.qty<=0)db.cart=db.cart.filter(i=>i.id!==id);save();refreshCart()}
function findCustomerId(text){if(!text)return"";const c=db.customers.find(c=>text===c.name+" — "+c.phone||text===c.name);return c?c.id:null}
function checkout(){if(!db.cart.length)return toast("请先加服务");const cid=findCustomerId($("#customerPicker").value);if(cid===null)return toast("请选择顾客");const sub=cartSubtotal(),d=discountValue(),deposit=depositValue(),total=sub-d-deposit;const sale={id:uid("sale"),date:today(),time:new Date().toTimeString().slice(0,5),customerId:cid,staffId:$("#staffPicker").value,payment:$("#payment").value,items:db.cart.map(x=>({...x})),subtotal:sub,discount:d,deposit,total,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};db.sales.push(sale);if(cid){const c=db.customers.find(c=>c.id===cid);c.visits=(c.visits||0)+1;c.spend=(c.spend||0)+total}db.cart=[];discAmount=0;discMode="percent";save();toast("收款已保存");go("reports")}

function filterSalesForSearch(q){
  q=(q||"").trim().toLowerCase();
  if(!q)return db.sales.slice().reverse();
  return db.sales.filter(s=>{
    const customer=db.customers.find(c=>c.id===s.customerId);
    const customerText=customer?(customer.name+" "+(customer.phone||"")):"散客";
    const items=(s.items||[]).map(i=>i.name).join(" ");
    const text=[
      s.date||"",s.time||"",s.payment||"",customerText,items,
      String(s.subtotal||""),String(s.discount||""),String(s.total||"")
    ].join(" ").toLowerCase();
    return text.includes(q);
  }).slice().reverse();
}

function deleteCustomerVisit(customerId,visitId){
  const c=db.customers.find(x=>x.id===customerId);
  if(!c||!confirm("确定要删除这笔之前光顾记录吗？"))return;
  const visit=(c.history||[]).find(x=>x.id===visitId);
  if(visit){
    c.visits=Math.max(0,(c.visits||0)-1);
    c.spend=Math.max(0,(c.spend||0)-(Number(visit.amount)||0));
  }
  c.history=(c.history||[]).filter(x=>x.id!==visitId);
  save();openCustomerHistory(customerId);
}

function compressLogo(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=320,scale=Math.min(1,max/Math.max(img.width,img.height)),width=Math.max(1,Math.round(img.width*scale)),height=Math.max(1,Math.round(img.height*scale)),canvas=document.createElement("canvas");canvas.width=width;canvas.height=height;const context=canvas.getContext("2d");context.clearRect(0,0,width,height);context.drawImage(img,0,0,width,height);resolve(canvas.toDataURL("image/webp",.82))};img.src=reader.result};reader.readAsDataURL(file)})}

<script id="cross-device-settings-sync-addon">
(function(){
  let lastAutomaticSync=0;
  async function refreshFromDatabase(){
    if(document.hidden || !getDatabaseUrl() || !getDatabaseKey())return;
    if(remoteSyncInProgress || remoteSaveTimer)return;
    const now=Date.now();
    if(now-lastAutomaticSync<15000)return;
    lastAutomaticSync=now;
    await syncFromDatabase(false);
  }
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshFromDatabase()});
  window.addEventListener("focus",refreshFromDatabase);
  setInterval(refreshFromDatabase,30000);
})();
</script>

  };

  let currentLang = localStorage.getItem("glowith_lang") || "zh";

  function translateTextNode(el){
    if(!el || el.children.length!==0) return;
    const raw = el.textContent;
    const trimmed = raw.trim();
    if(!trimmed) return;
    const englishOnlyPage=typeof page!=="undefined"&&["pos","services"].includes(page)&&
      (el.closest("#content")||el.closest("#modalRoot"));
    const dict = (currentLang==="en"||englishOnlyPage) ? zhToEn : enToZh;
    if(dict[trimmed]){
      el.textContent = raw.replace(trimmed, dict[trimmed]);
    }
  }

  function translatePlaceholders(){
    document.querySelectorAll("input[placeholder],textarea[placeholder]").forEach(el=>{
      const englishOnlyPage=typeof page!=="undefined"&&["pos","services"].includes(page)&&
        (el.closest("#content")||el.closest("#modalRoot"));
      const dict = (currentLang==="en"||englishOnlyPage) ? zhToEn : enToZh;
      const p=el.getAttribute("placeholder");
      if(dict[p]) el.setAttribute("placeholder",dict[p]);
    });
  }

  function applyLanguage(){
    document.documentElement.lang = currentLang==="en" ? "en" : "zh-CN";
    document.querySelectorAll("button,label,h1,h2,h3,h4,th,td,span,small,p,div,option").forEach(translateTextNode);
    translatePlaceholders();
    document.querySelectorAll("[data-safe-lang]").forEach(b=>{
      b.classList.toggle("active",b.dataset.safeLang===currentLang);
    });
  }

  const nativeConfirm=window.confirm.bind(window);
  window.confirm=function(message){
    const text=String(message);
    return nativeConfirm(currentLang==="en"?(zhToEn[text]||text):(enToZh[text]||text));
  };

  function ensureSwitch(){
    const topbar=document.querySelector(".topbar");
    if(topbar && !document.getElementById("safeLangSwitch")){
      const sw=document.createElement("div");
      sw.id="safeLangSwitch";
      sw.className="lang-switch-safe";

      topbar.appendChild(sw);
    }
  }

  document.addEventListener("click",function(e){
    const b=e.target.closest("[data-safe-lang]");
    if(!b)return;
    currentLang=b.dataset.safeLang;
    localStorage.setItem("glowith_lang",currentLang);
    if(typeof render==="function") render();
    else { ensureSwitch(); applyLanguage(); }
  });

  let languageUpdateQueued=false;
  function scheduleLanguageUpdate(){
    if(languageUpdateQueued)return;
    languageUpdateQueued=true;
    requestAnimationFrame(function(){
      languageUpdateQueued=false;
      ensureSwitch();
      applyLanguage();
    });
  }
  const languageObserver=new MutationObserver(scheduleLanguageUpdate);
  languageObserver.observe(document.body,{childList:true,subtree:true});

  // Patch render once, safely.
  if(typeof render==="function"){
    const originalRender=render;
    window.render=function(){
      const result=originalRender.apply(this,arguments);
      ensureSwitch();
      applyLanguage();
      return result;
    };
  }

  // Initial setup after original app load.
  ensureSwitch();
  applyLanguage();
})();
</script>

(function(){
  function fix(){
    document.querySelectorAll("#sidebarNewSale,.sidebar-new-sale").forEach(x=>x.remove());

    if(typeof page!=="undefined" && page==="dashboard"){
      const card=[...document.querySelectorAll(".card")].find(c=>{
        const t=c.textContent||"";
        return t.includes("最近销售记录")||t.includes("Recent Sales");
      });
      if(card && !card.querySelector("#dashboardNewSaleBtn")){
        const title=[...card.querySelectorAll("h2,h3,h4")].find(h=>{
          const t=(h.textContent||"").trim();
          return t==="最近销售记录"||t==="Recent Sales";
        });
        const btn=document.createElement("button");
        btn.id="dashboardNewSaleBtn";
        btn.className="action-dark";
        btn.type="button";
        btn.textContent="+ 开新单";
        btn.onclick=()=>{page="pos";render();};
        if(title){
          const wrap=document.createElement("div");
          wrap.className="dashboard-sales-head";
          title.parentNode.insertBefore(wrap,title);
          wrap.appendChild(title);
          wrap.appendChild(btn);
        }else card.insertBefore(btn,card.firstChild);
      }
    }

    if(typeof page!=="undefined" && page==="customers"){
      const search=document.querySelector("#customerSearch");
      const btn=document.querySelector("#addCustomerBtn");
      if(search&&btn&&!search.parentElement.classList.contains("customer-actions")){
        const wrap=document.createElement("div");
        wrap.className="customer-actions";
        search.parentNode.insertBefore(wrap,search);
        wrap.appendChild(search);
        wrap.appendChild(btn);
        btn.classList.add("action-dark");
      }
    }

    if(typeof page!=="undefined" && page==="services"){
      const search=document.querySelector("#serviceSearch");
      const btn=document.querySelector("#addServiceBtn");
      if(search&&btn&&!search.parentElement.classList.contains("service-actions")){
        const wrap=document.createElement("div");
        wrap.className="service-actions";
        search.parentNode.insertBefore(wrap,search);
        wrap.appendChild(search);
        wrap.appendChild(btn);
        btn.classList.add("action-dark");
      }
    }
  }

  const oldRender=window.render;
  if(typeof oldRender==="function"){
    window.render=function(){
      const r=oldRender.apply(this,arguments);
      fix();
      return r;
    };
  }
  fix();
})();
</script>


<script id="dashboard-new-sale-position-fix">
(function(){
  function fixDashboardButton(){
    if(typeof page==="undefined" || page!=="dashboard") return;
    const btn=document.getElementById("dashboardNewSaleBtn");
    if(!btn) return;
    const head=btn.closest(".dashboard-sales-head");
    if(head){
      head.style.width="100%";
      head.style.display="flex";
      head.style.alignItems="center";
      head.style.justifyContent="space-between";
      btn.style.marginLeft="auto";
    }
  }

  const oldRender=window.render;
  if(typeof oldRender==="function"){
    window.render=function(){
      const r=oldRender.apply(this,arguments);
      fixDashboardButton();
      return r;
    };
  }
  fixDashboardButton();
})();
</script>


<script id="settings-two-column-eye-addon">
(function(){
  function enhanceSettings(){
    if(typeof page==="undefined" || page!=="settings") return;

    const content=document.getElementById("content");
    if(!content) return;

    // Find the main settings card.
    const cards=[...content.querySelectorAll(".card")];
    const mainCard=cards.find(card=>{
      const txt=(card.textContent||"");
      return txt.includes("店设置") || txt.includes("Store Settings");
    });
    if(!mainCard) return;

    // Build two-column layout only once per render.
    if(!mainCard.querySelector(".settings-two-col")){
      const title=[...mainCard.children].find(el=>/^H[1-4]$/.test(el.tagName));
      const fields=[...mainCard.children].filter(el=>el.classList && el.classList.contains("field"));
      const saveBtn=[...mainCard.children].find(el=>el.id==="saveSettingsBtn");
      const menuSettings=[...mainCard.children].find(el=>el.classList?.contains("menu-toggle-settings"));

      const left=document.createElement("div");
      left.className="settings-left";
      const right=document.createElement("div");
      right.className="settings-right";
      const grid=document.createElement("div");
      grid.className="settings-two-col";

      const rightLabels=[
        "主题颜色","Theme Color",
        "版面背景颜色","Panel Color",
        "字体颜色","Font Color",
        "字体粗细","Font Weight",
        "店 Logo","Store Logo"
      ];

      fields.forEach(field=>{
        const label=field.querySelector("label");
        const text=(label?.textContent||"").trim();
        if(rightLabels.includes(text)) right.appendChild(field);
        else left.appendChild(field);
      });

      if(saveBtn) left.appendChild(saveBtn);
      if(menuSettings) left.appendChild(menuSettings);

      grid.appendChild(left);
      grid.appendChild(right);

      if(title) title.insertAdjacentElement("afterend",grid);
      else mainCard.prepend(grid);
    }

    // Password eye
    const pw=document.getElementById("loginPasswordSetting");
    if(pw && !document.getElementById("loginPasswordEye")){
      const wrap=document.createElement("div");
      wrap.className="password-wrap";
      pw.parentNode.insertBefore(wrap,pw);
      wrap.appendChild(pw);

      const eye=document.createElement("button");
      eye.type="button";
      eye.id="loginPasswordEye";
      eye.className="password-eye";
      eye.setAttribute("aria-label","查看密码");
      eye.title="查看密码";
      eye.textContent="👁";
      eye.onclick=function(){
        const showing=pw.type==="text";
        pw.type=showing?"password":"text";
        eye.textContent=showing?"👁":"🙈";
        eye.title=showing?"查看密码":"隐藏密码";
      };
      wrap.appendChild(eye);
    }

  }

  const oldRender=window.render;
  if(typeof oldRender==="function"){
    window.render=function(){
      const r=oldRender.apply(this,arguments);
      enhanceSettings();
      return r;
    };
  }
  enhanceSettings();
})();
</script>





<script id="page-session-timeout-addon-v2">
(function(){
  const PAGE_KEY="glowith_last_page";
  const AUTH_KEY="glowith_session_active";
  const ACTIVITY_KEY="glowith_last_activity";
  const VALID_PAGES=["dashboard","pos","appointments","customers","services","staff","membership","reports","settings"];

  function now(){return Date.now();}
  function timeoutMs(){
    const minutes=Number((typeof db!=="undefined"&&db.settings&&db.settings.autoLogoutMinutes)||3);
    return Math.max(1,Math.min(120,Number.isFinite(minutes)?minutes:3))*60*1000;
  }
  function appVisible(){
    const app=document.getElementById("app");
    return !!app && !app.classList.contains("hidden");
  }
  function sessionValid(){
    const active=localStorage.getItem(AUTH_KEY)==="1";
    const last=Number(localStorage.getItem(ACTIVITY_KEY)||0);
    return active && last>0 && (now()-last)<timeoutMs();
  }
  function savePage(){
    try{
      if(typeof page!=="undefined" && VALID_PAGES.includes(page)){
        localStorage.setItem(PAGE_KEY,page);
      }
    }catch(e){}
  }
  let lastTouchWrite=0;
  function touch(){
    const timestamp=now();
    if(timestamp-lastTouchWrite<5000)return;
    if(appVisible() && localStorage.getItem(AUTH_KEY)==="1"){
      lastTouchWrite=timestamp;
      localStorage.setItem(ACTIVITY_KEY,String(timestamp));
      savePage();
    }
  }
  function showLogin(){
    const app=document.getElementById("app");
    const login=document.getElementById("login");
    if(app)app.classList.add("hidden");
    if(login)login.classList.remove("hidden");
    localStorage.removeItem(AUTH_KEY);
    localStorage.removeItem(ACTIVITY_KEY);
  }
  function restoreSession(){
    if(!sessionValid()){
      showLogin();
      return;
    }
    const saved=localStorage.getItem(PAGE_KEY);
    if(saved && VALID_PAGES.includes(saved) && typeof page!=="undefined"){
      page=saved;
    }
    const login=document.getElementById("login");
    const app=document.getElementById("app");
    if(login)login.classList.add("hidden");
    if(app)app.classList.remove("hidden");
    if(typeof render==="function")render();
  }

  // Remember every page change without changing existing navigation logic.
  const originalGo=window.go;
  if(typeof originalGo==="function"){
    window.go=function(p){
      const result=originalGo.apply(this,arguments);
      try{
        if(VALID_PAGES.includes(p))localStorage.setItem(PAGE_KEY,p);
      }catch(e){}
      touch();
      return result;
    };
  }

  // The original login button already calls login().
  // After a successful login (app becomes visible), create the session and restore last page.
  const loginBtn=document.getElementById("loginBtn");
  if(loginBtn){
    loginBtn.addEventListener("click",function(){
      setTimeout(function(){
        if(appVisible()){
          localStorage.setItem(AUTH_KEY,"1");
          localStorage.setItem(ACTIVITY_KEY,String(now()));
          const saved=localStorage.getItem(PAGE_KEY);
          if(saved && VALID_PAGES.includes(saved) && typeof page!=="undefined"){
            page=saved;
            if(typeof render==="function")render();
          }
        }
      },0);
    });
  }

  // Explicit logout must invalidate the session, but keep the last page.
  const logoutBtn=document.getElementById("logoutBtn");
  if(logoutBtn){
    logoutBtn.addEventListener("click",function(){
      savePage();
      localStorage.removeItem(AUTH_KEY);
      localStorage.removeItem(ACTIVITY_KEY);
    },true);
  }

  // Real user activity resets the adjustable inactivity timer.
  ["pointerdown","keydown","touchstart","wheel","input","change"].forEach(evt=>{
    document.addEventListener(evt,touch,{passive:true});
  });

  // Check inactivity.
  setInterval(function(){
    if(localStorage.getItem(AUTH_KEY)!=="1")return;
    const last=Number(localStorage.getItem(ACTIVITY_KEY)||0);
    if(!last || now()-last>=timeoutMs()){
      savePage();
      showLogin();
    }
  },5000);

  window.addEventListener("beforeunload",function(){
    savePage();
  });

  // This is the important part for Refresh / Reload:
  // Restore the same page while the adjustable inactivity session is valid.
  restoreSession();
})();
</script>

</body>
</html>
